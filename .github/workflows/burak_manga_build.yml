# Dosya Yolu: REPO_ROOT/.github/workflows/burak_manga_build.yml
# Amac: Iki manga uzantisinin gercek Gradle APK derleme ve lint testleri
# Modul - YAML
# Version: 0.1.0
# Aciklama: PR veya elle tetiklenen, yayinlama yapmayan hedefli build
# Bagimli Oldugu Katman: Testing
name: Burak Manga Extensions - targeted Gradle
on:
  pull_request:
    paths:
      - 'src/tr/ruyamanga/**'
      - 'src/tr/merlinscans/**'
      - '.github/workflows/burak_manga_build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-ruya-and-merlin:
    name: Build and lint selected sources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Assemble and lint Ruya Manga + Merlin Scans
        run: |
          ./gradlew --no-daemon \
            :src:tr:ruyamanga:assembleRelease \
            :src:tr:ruyamanga:lintRelease \
            :src:tr:merlinscans:assembleRelease \
            :src:tr:merlinscans:lintRelease
      - name: Stage and verify review-only APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-apks
          for name in ruyamanga merlinscans; do
            dir="src/tr/$name/build/outputs/apk/release"
            mapfile -d '' apks < <(find "$dir" -maxdepth 1 -type f -name '*.apk' -print0)
            if [ "${#apks[@]}" -ne 1 ]; then
              echo "EXPECTED_EXACTLY_ONE_APK_FOR: $name" >&2
              exit 1
            fi
            cp -- "${apks[0]}" "review-apks/$name.apk"
          done
          (
            cd review-apks
            sha256sum ruyamanga.apk merlinscans.apk > SHA256SUMS.txt
            printf 'commit=%s\nkind=temporary-debug-signed-test-apks\n' "$GITHUB_SHA" > BUILD_INFO.txt
          )
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APK_SIGNER" ]; then
            echo 'ANDROID_APKSIGNER_NOT_FOUND' >&2
            exit 1
          fi
          "$APK_SIGNER" verify --verbose review-apks/ruyamanga.apk
          "$APK_SIGNER" verify --verbose review-apks/merlinscans.apk
      - name: Upload temporary test APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burak-manga-test-apks
          path: review-apks/
          if-no-files-found: error
          retention-days: 3
