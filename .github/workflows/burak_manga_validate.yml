# Dosya Yolu: REPO_ROOT/.github/workflows/burak_manga_validate.yml
# Amac: Manga kaynak metadata testlerini PR'da cevrimdisi kosar
# Modul - YAML
# Version: 0.1.0
# Aciklama: Release ve APK uretmeyen kaynak kontrati CI kontrolu
# Bagimli Oldugu Katman: Testing
name: Burak Manga Extensions - source contracts
on:
  pull_request:
    paths:
      - 'docs/burak-manga/**'
      - 'scripts/burak_manga/**'
      - 'tests/burak_manga/**'
      - '.github/workflows/burak_manga_validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate source catalog without website requests
        run: python scripts/burak_manga/validate_sources.py
      - name: Offline unit tests
        run: python -m unittest discover -s tests/burak_manga -v
      - name: Parse Windows validation script
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          $Path = Join-Path $PWD 'scripts/burak_manga/validate-windows.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($Path, [ref]$Tokens, [ref]$Errors) | Out-Null
          if ($Errors.Count -gt 0) { $Errors | Format-List; exit 1 }
